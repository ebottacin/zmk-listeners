description: USB HID Indicator Listener

compatible: "zmk,hid-listeners"

properties:
  tap-ms:
    type: int
    description: Time to wait (in milliseconds) between the press and release events on a triggered listener behavior binding.
    default: 5
  wait-ms:
    type: int
    description: The default time to wait (in milliseconds) before triggering the next listener behavior binding.
    default: 5

child-binding:
  description: "A HID Indicator listener"
  properties:
    indicator:
      type: int
      required: true
    bindings:
      type: phandle-array
      required: true
